<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Entre Nós</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="home">

    <div class="page-transition">
        <div class="transition-glow"></div>
    </div>

    <div class="scene">

        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>

        <div class="stars stars-back"></div>
        <div class="stars stars-front"></div>

        <div class="dust dust-1"></div>
        <div class="dust dust-2"></div>
        <div class="dust dust-3"></div>
        <div class="dust dust-4"></div>

        <div class="vignette"></div>

    </div>

    <main class="home-content">

        <div class="top-label">
            <span class="label-line"></span>
            <span>UMA PEQUENA CONVERSA</span>
            <span class="label-line"></span>
        </div>

        <div class="hero-center">

            <div class="tiny-star">✦</div>

            <p class="pre-title">
                algumas coisas
            </p>

            <h1>
                Entre
                <span>Nós</span>
            </h1>

            <p class="hero-description">
                antes de continuar,<br>
                me diga seu nome
            </p>

            <form id="nameForm" class="name-form">

                <div class="input-wrapper">

                    <input
                        id="nameInput"
                        type="text"
                        placeholder="seu nome"
                        maxlength="40"
                        autocomplete="off"
                        autocapitalize="words"
                        required
                    >

                    <span class="input-line"></span>

                </div>

                <button type="submit" class="continue-button">

                    <span>continuar</span>

                    <span class="arrow">
                        →
                    </span>

                </button>

            </form>

        </div>

        <div class="bottom-info">

            <span>03</span>

            <div class="bottom-line"></div>

            <span>10.2026</span>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
